<style>

:root {
  --bg:#07080c;--bg2:#0d0f18;--bg3:#131620;--bg4:#191d28;--bg5:#202535;
  --br:#1e2335;--br2:#2a3050;--br3:#374060;
  --t:#e4e8f5;--t2:#8892b0;--t3:#4a5580;--t4:#2e3655;
  --acc:#6c5ce7;--acc2:#a29bfe;--accbg:rgba(108,92,231,.12);
  --grn:#00e676;--gnbg:rgba(0,230,118,.1);
  --amb:#ffca28;--ambg:rgba(255,202,40,.1);
  --cor:#ff7043;--cobg:rgba(255,112,67,.1);
  --blu:#2979ff;--blbg:rgba(41,121,255,.1);
  --tel:#26c6da;--tebg:rgba(38,198,218,.1);
  --pnk:#f06292;--pkbg:rgba(240,98,146,.1);
  --red:#ef5350;--rebg:rgba(239,83,80,.1);
  --gld:#ffd740;--gobg:rgba(255,215,64,.1);
  --pur:#d63af9;--pubg:rgba(214,58,249,.1);
  --font-display:'Syne',sans-serif;--font-body:'Cabinet Grotesk',sans-serif;--font-mono:'JetBrains Mono',monospace;
}
html[data-theme="light"] {
  --bg:#f5f6fa;--bg2:#fff;--bg3:#eef0f7;--bg4:#e4e7f2;--bg5:#d8dcee;
  --br:#dde1f0;--br2:#c8ceea;--br3:#b0b8e0;
  --t:#111827;--t2:#374151;--t3:#6b7280;--t4:#9ca3af;
  --acc:#6c5ce7;--acc2:#5b4bd4;--accbg:rgba(108,92,231,.1);
  --grn:#00a854;--gnbg:rgba(0,168,84,.1);
  --amb:#c88a00;--ambg:rgba(200,138,0,.1);
  --cor:#e84e2a;--cobg:rgba(232,78,42,.1);
  --red:#dc2626;--rebg:rgba(220,38,38,.1);
  --gld:#d97706;--gobg:rgba(217,119,6,.1);
  --pur:#b020e0;--pubg:rgba(176,32,224,.1);
  --tel:#0891b2;--tebg:rgba(8,145,178,.1);
  --pnk:#db2777;--pkbg:rgba(219,39,119,.1);
  --blu:#1a5fd4;--blbg:rgba(26,95,212,.1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-body);background:var(--bg);color:var(--t);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:var(--font-body)}
input,textarea,select{font-family:var(--font-body)}
a{color:var(--acc2);text-decoration:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--br2);border-radius:2px}
#app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:224px;min-width:224px;background:var(--bg2);border-right:1px solid var(--br);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:16px;border-bottom:1px solid var(--br)}
.brand-logo{font-family:var(--font-display);font-size:17px;font-weight:800;background:linear-gradient(135deg,#26c6da,#a29bfe);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.brand-role{font-family:var(--font-mono);font-size:9px;color:var(--t3);margin-top:2px;text-transform:uppercase;letter-spacing:.1em}
.brand-badge{display:inline-flex;align-items:center;gap:4px;background:var(--tebg);border:1px solid rgba(38,198,218,.25);color:var(--tel);border-radius:4px;padding:2px 7px;font-family:var(--font-mono);font-size:8px;margin-top:5px;letter-spacing:.05em}
.nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-grp{font-family:var(--font-mono);font-size:9px;color:var(--t4);padding:10px 14px 3px;letter-spacing:.1em;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 12px 7px 14px;font-size:12px;font-weight:500;color:var(--t2);border-left:2px solid transparent;transition:all .12s;cursor:pointer;user-select:none}
.nav-item:hover{background:var(--bg3);color:var(--t)}
.nav-item.active{background:var(--accbg);color:var(--acc2);border-left-color:var(--acc)}
.nav-icon{width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.nav-badge{margin-left:auto;font-family:var(--font-mono);font-size:8px;padding:2px 5px;border-radius:3px;background:var(--bg4);color:var(--t3)}
.nav-badge.warn{background:var(--ambg);color:var(--amb)}
.nav-badge.ok{background:var(--gnbg);color:var(--grn)}
.sidebar-footer{padding:12px;border-top:1px solid var(--br)}
.avatar-ring{width:36px;height:36px;border-radius:50%;border:2px solid var(--tel);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--tebg);color:var(--tel);flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:52px;background:var(--bg2);border-bottom:1px solid var(--br);display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0}
.topbar-title{font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--t);flex:1}
.content{flex:1;overflow-y:auto;padding:20px;background:var(--bg)}
.panel{display:none;animation:fadeIn .2s ease}
.panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--bg2);border:1px solid var(--br);border-radius:9px;padding:16px;margin-bottom:10px}
.card-title{font-family:var(--font-display);font-size:13px;font-weight:700;color:var(--t);margin-bottom:3px}
.card-sub{font-size:11px;color:var(--t3);margin-bottom:12px;line-height:1.55}
.sl{font-family:var(--font-mono);font-size:9px;font-weight:500;color:var(--t3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.mrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.met{background:var(--bg2);border:1px solid var(--br);border-radius:9px;padding:12px;transition:border-color .15s}
.met:hover{border-color:var(--br2)}
.met-label{font-family:var(--font-mono);font-size:9px;color:var(--t3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
.met-val{font-family:var(--font-mono);font-size:22px;font-weight:500;margin-bottom:2px}
.met-sub{font-size:10px;color:var(--t3)}
.btn{font-family:var(--font-body);font-size:12px;font-weight:500;padding:7px 14px;border-radius:6px;border:1px solid var(--br2);background:var(--bg4);color:var(--t2);cursor:pointer;transition:all .12s;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:var(--bg5);color:var(--t)}
.btn-primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn-primary:hover{background:#7c6cf0;color:#fff}
.btn-success{background:var(--gnbg);border-color:rgba(0,230,118,.3);color:var(--grn)}
.btn-warn{background:var(--ambg);border-color:rgba(255,202,40,.3);color:var(--amb)}
.btn-tel{background:var(--tebg);border-color:rgba(38,198,218,.3);color:var(--tel)}
.btn-sm{font-size:11px;padding:4px 10px}
.btn-a{background:var(--accbg);border-color:rgba(108,92,231,.3);color:var(--acc2);font-weight:600}
.btn-danger{background:var(--rebg);border-color:rgba(239,83,80,.3);color:var(--red)}
input[type="text"],input[type="email"],input[type="number"],input[type="datetime-local"],input[type="search"],select,textarea{width:100%;background:var(--bg3);border:1px solid var(--br);border-radius:5px;color:var(--t);font-size:12px;padding:7px 10px;outline:none;transition:border-color .12s;appearance:none;font-family:var(--font-body)}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:72px;line-height:1.6}
.input-label{font-size:9px;font-weight:500;color:var(--t3);margin-bottom:3px;font-family:var(--font-mono);letter-spacing:.06em;text-transform:uppercase}
.input-group{margin-bottom:8px}
.data-table{width:100%;border-collapse:collapse;font-size:11px}
.data-table th{background:var(--bg4);color:var(--t2);padding:8px 10px;text-align:left;font-weight:600;font-size:10px;letter-spacing:.05em;text-transform:uppercase}
.data-table td{padding:8px 10px;border-bottom:1px solid var(--br);color:var(--t2)}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:var(--bg3)}
.tag{font-family:var(--font-mono);font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;display:inline-block;margin:1px}
.tag-grn{background:var(--gnbg);color:var(--grn)}
.tag-amb{background:var(--ambg);color:var(--amb)}
.tag-cor{background:var(--cobg);color:var(--cor)}
.tag-acc{background:var(--accbg);color:var(--acc2)}
.tag-red{background:var(--rebg);color:var(--red)}
.tag-tel{background:var(--tebg);color:var(--tel)}
.tag-pur{background:var(--pubg);color:var(--pur)}
.tag-gld{background:var(--gobg);color:var(--gld)}
.prog-bar{height:5px;background:var(--bg5);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .5s ease}
.prog-bar-thick{height:8px;background:var(--bg5);border-radius:4px;overflow:hidden}
.tab-row{display:flex;border:1px solid var(--br);border-radius:6px;overflow:hidden;margin-bottom:12px;background:var(--bg2)}
.tab-btn{flex:1;font-size:11px;font-weight:500;padding:7px 4px;cursor:pointer;background:none;border:none;color:var(--t3);transition:all .12s;text-align:center;font-family:var(--font-body)}
.tab-btn:hover{background:var(--bg3);color:var(--t2)}
.tab-btn.active{background:var(--accbg);color:var(--acc2)}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.flex-row{display:flex;align-items:center;gap:8px}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.founder-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg3);border:1px solid var(--br);border-radius:7px;cursor:pointer;transition:all .12s;margin-bottom:5px}
.founder-row:hover{border-color:var(--br2);background:var(--bg4)}
.f-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;background:var(--accbg);color:var(--acc2)}
.f-name{font-size:12px;font-weight:600;color:var(--t)}
.f-meta{font-size:10px;color:var(--t3)}
.msg-item{display:flex;gap:10px;padding:10px 12px;background:var(--bg3);border-radius:7px;border:1px solid var(--br);cursor:pointer;transition:all .12s;margin-bottom:4px}
.msg-item:hover{border-color:var(--br2);background:var(--bg4)}
.msg-item.unread{border-left:3px solid var(--tel)}
.msg-avatar{width:34px;height:34px;border-radius:50%;background:var(--tebg);color:var(--tel);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.msg-preview{flex:1;min-width:0}
.msg-name{font-size:12px;font-weight:600;color:var(--t);margin-bottom:2px}
.msg-text{font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-meta{font-family:var(--font-mono);font-size:9px;color:var(--t4);text-align:right;white-space:nowrap;flex-shrink:0}
.session-card{background:var(--bg3);border:1px solid var(--br);border-radius:8px;padding:12px;margin-bottom:6px;transition:all .12s}
.session-card:hover{border-color:var(--tel)}
.session-time{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--tel);margin-bottom:3px}
.resource-card{background:var(--bg3);border:1px solid var(--br);border-radius:8px;padding:12px;display:flex;align-items:flex-start;gap:10px;margin-bottom:6px;cursor:pointer;transition:all .12s}
.resource-card:hover{border-color:var(--acc);background:var(--bg4)}
.resource-icon{width:36px;height:36px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--bg4)}
.check-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--br);font-size:11px}
.check-item:last-child{border-bottom:none}
.check-box{width:16px;height:16px;border-radius:4px;border:2px solid var(--br2);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .12s}
.check-box.done{background:var(--gnbg);border-color:var(--grn);color:var(--grn)}
.theme-toggle{display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--br);border-radius:20px;padding:4px 10px;cursor:pointer;font-family:var(--font-mono);font-size:10px;color:var(--t2);transition:all .2s;user-select:none}
.toggle-track{width:28px;height:15px;background:var(--br2);border-radius:8px;position:relative;transition:background .2s;flex-shrink:0}
.toggle-thumb{width:11px;height:11px;background:var(--t2);border-radius:50%;position:absolute;top:2px;left:2px;transition:all .2s}
html[data-theme="light"] .toggle-track{background:var(--acc)}
html[data-theme="light"] .toggle-thumb{left:15px;background:#fff}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9999;backdrop-filter:blur(4px)}
.modal{background:var(--bg2);border:1px solid var(--br2);border-radius:12px;padding:24px;width:540px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal-title{font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--t);margin-bottom:14px}
.toast{position:fixed;bottom:20px;right:20px;padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;z-index:99999;transition:opacity .3s;pointer-events:none}
.alert{border-radius:7px;padding:10px 14px;font-size:11px;margin-bottom:8px;display:flex;align-items:flex-start;gap:8px}
.alert-warn{background:var(--ambg);border:1px solid rgba(255,202,40,.25);color:var(--amb)}
.alert-info{background:var(--blbg);border:1px solid rgba(41,121,255,.25);color:var(--blu)}
.alert-ok{background:var(--gnbg);border:1px solid rgba(0,230,118,.25);color:var(--grn)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-grn{background:var(--grn);box-shadow:0 0 6px rgba(0,230,118,.5)}
.dot-tel{background:var(--tel);box-shadow:0 0 6px rgba(38,198,218,.5)}
.dot-amb{background:var(--amb)}
.thinking{color:var(--t3);font-style:italic;font-size:11px}
.thinking::after{content:'';display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--tel);animation:pulse 1.2s ease infinite;margin-left:6px;vertical-align:middle}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@media(max-width:768px){.sidebar{width:52px;min-width:52px}.sidebar .brand-role,.sidebar .nav-grp,.brand-badge,.nav-item span:not(.nav-icon),.nav-badge,.sidebar-footer .footer-info{display:none}.nav-item{justify-content:center;padding:8px}.mrow{grid-template-columns:1fr 1fr}}

</style>
</head>
<body>
<div id="app"></div>
<script>

(function(){
'use strict';

const themeSystem = {
  current: localStorage.getItem(THEME_KEY) || 'dark',
  init(){ this.apply(this.current, false); },
  apply(t, save=true){
    this.current = t;
    document.documentElement.setAttribute('data-theme', t);
    if (save) localStorage.setItem(THEME_KEY, t);
    const icon = document.getElementById('theme-icon');
    const lbl  = document.getElementById('theme-label');
    if (icon) icon.textContent = t==='light'?'☀️':'🌙';
    if (lbl)  lbl.textContent  = t==='light'?'Light':'Dark';
  },
  toggle(){ this.apply(this.current==='dark'?'light':'dark'); }
};

window.toggleTrainerTheme = () => themeSystem.toggle();

const TRAINER_DATA_KEY = 'los_trainer_data_v1';
function loadTrainerData(){
  try{
    const d = JSON.parse(localStorage.getItem(TRAINER_DATA_KEY)||'null');
    if(!d) return;
    if(Array.isArray(d.readIds)) INBOX_MSGS.forEach(m=>{ if(d.readIds.includes(m.id)) m.unread=false; });
    if(Array.isArray(d.sent)) SENT_MSGS.splice(0, SENT_MSGS.length, ...d.sent);
    if(Array.isArray(d.upcoming)) UPCOMING_SESSIONS.splice(0, UPCOMING_SESSIONS.length, ...d.upcoming);
    if(d.founderSessions) MY_FOUNDERS.forEach(f=>{ if(Array.isArray(d.founderSessions[f.id])) f.sessions = d.founderSessions[f.id]; });
  }catch(e){ console.warn('Trainer data could not be loaded', e); }
}
function saveTrainerData(){
  try{
    const founderSessions = {}; MY_FOUNDERS.forEach(f=>{ founderSessions[f.id] = f.sessions; });
    localStorage.setItem(TRAINER_DATA_KEY, JSON.stringify({
      readIds: INBOX_MSGS.filter(m=>!m.unread).map(m=>m.id),
      sent: SENT_MSGS, upcoming: UPCOMING_SESSIONS, founderSessions,
    }));
  }catch(e){ console.warn('Trainer data could not be saved', e); }
}
loadTrainerData();

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function val(id){ return (document.getElementById(id)?.value || '').trim(); }

function fmtTime(d){ return d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }

  dashboard: renderDashboard,
  'my-founders': renderMyFounders,
  sessions: renderSessions,
  progress: renderProgress,
  inbox: renderInbox,
  feedback: renderFeedback,
  cohort: renderCohort,
  resources: renderResources,
  profile: renderProfile,

const TITLES = {
  dashboard:'Dashboard','my-founders':'My Founders',sessions:'Sessions',
  progress:'Progress Notes',inbox:'Inbox',feedback:'Session Feedback',
  cohort:'Cohort Overview',resources:'Resources',profile:'My Profile',
};

let contentEl;

function go(panelId){
  if(!PANELS[panelId]) return;
  state.panel = panelId;
  document.querySelectorAll('.nav-item').forEach(el=>{
    const m=el.getAttribute('onclick')?.match(/go\('(.+?)'\)/);
    if(m) el.classList.toggle('active', m[1]===panelId);
  });
  const titleEl = document.getElementById('topbar-title');
  if(titleEl) titleEl.textContent = TITLES[panelId]||panelId;
  let panel = document.getElementById('panel-'+panelId);
  if(!panel){panel=document.createElement('div');panel.className='panel';panel.id='panel-'+panelId;contentEl.appendChild(panel);}
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  panel.innerHTML = PANELS[panelId]();
  panel.classList.add('active');
  contentEl.scrollTop=0;
}

function refreshPanel(){go(state.panel);}
function setSessTab(t){state.sessTab=t;refreshPanel();}
function setInboxTab(t){state.inboxTab=t;refreshPanel();}
function setFocusFounder(id){state.focusFounder=id;refreshPanel();}
function setPlanFounder(id){state.planFounder=id;refreshPanel();}
function openProgressFor(id){state.focusFounder=id;go('progress');}

function toggleCheck(id){
  state.checks[id]=!state.checks[id];
  state.saveChecks();
  go('dashboard');
}
function saveMentorNote(fId){
  const el=document.getElementById('mentor-note-'+fId);
  if(el){state.notes[fId]=el.value;state.saveNotes();showToast('Notes saved ✓');}
}
let currentRating = 0, currentEscalate = false;
function setRating(n){
  currentRating = n;
  document.querySelectorAll('[id^="star-"]').forEach((b,i)=>{
    b.style.opacity=i+1<=n?'1':'0.4';
  });
}
function setEscalate(v){
  currentEscalate = !!v;
  const yes=document.getElementById('esc-yes'), no=document.getElementById('esc-no');
  if(yes) yes.style.opacity = v?'1':'0.45';
  if(no)  no.style.opacity  = v?'0.45':'1';
}
function saveFeedback(){
  const f = MY_FOUNDERS.find(x=>x.id===val('fb-founder'));
  if(!f){ showToast('Choose a founder', false); return; }
  if(!currentRating){ showToast('Pick a rating (1–5 stars)', false); return; }
  const well=val('fb-well'), improve=val('fb-improve'), actions=val('fb-actions');
  const notes = [well&&('Went well: '+well), improve&&('Needs work: '+improve), actions&&('Actions: '+actions)].filter(Boolean).join(' · ') || '—';
  f.sessions.push({ date:new Date().toISOString().slice(0,10), type:val('fb-type')||'Session', duration:60, notes, rating:currentRating, escalated:currentEscalate });
  if(currentEscalate){
    SENT_MSGS.unshift({ id:'s_'+Date.now(), type:'sent', to:'Admin', subject:'⚠ Founder flagged: '+f.name, body:notes, time:new Date().toLocaleString() });
  }
  saveTrainerData();
  const flagged = currentEscalate;
  currentRating=0; currentEscalate=false;
  showToast(flagged?'Feedback saved and admin flagged ✓':'Session feedback saved ✓');
  refreshPanel();
}

      <div class="input-group"><div class="input-label">Business</div><div style="font-size:12px;color:var(--t2);background:var(--bg3);border-radius:5px;padding:8px">${f.business}</div></div>

        <div class="input-group"><div class="input-label">Strengths</div><div style="font-size:11px;color:var(--grn);background:var(--gnbg);border-radius:5px;padding:8px">${f.strengths}</div></div>
        <div class="input-group"><div class="input-label">Blockers</div><div style="font-size:11px;color:var(--amb);background:var(--ambg);border-radius:5px;padding:8px">${f.blockers}</div></div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">
        <button class="btn btn-sm btn-primary" onclick="closeModal();openComposeTo('${f.id}','${f.name}')">✉ Message</button>
        <button class="btn btn-sm btn-tel" onclick="closeModal();openProgressFor('${f.id}')">📈 Full Notes</button>
        <button class="btn btn-sm btn-success" onclick="closeModal();scheduleSession('${f.id}','${f.name}')">📅 Book Session</button>
      </div>
    </div>
  </div>`);
}

function openMessage(id){
  const m=INBOX_MSGS.find(x=>x.id===id);if(!m)return;
  if(m.unread){ m.unread=false; saveTrainerData(); refreshNav(); if(state.panel==='inbox'||state.panel==='dashboard') refreshPanel(); }
  document.body.insertAdjacentHTML('beforeend',`<div class="overlay" id="msg-modal" onclick="if(event.target.id==='msg-modal')closeModal()">
    <div class="modal">
      <div class="flex-between" style="margin-bottom:14px"><div class="modal-title">${esc(m.subject)}</div><button class="btn btn-sm" onclick="closeModal()">✕</button></div>
      <div class="flex-row" style="margin-bottom:12px">
        <div class="msg-avatar">${esc(m.avatar)}</div>
        <div><div style="font-size:12px;font-weight:700;color:var(--t)">${esc(m.from)}</div><div style="font-size:10px;color:var(--t3)">${esc(m.time)}</div></div>
      </div>
      <div style="font-size:12px;color:var(--t2);line-height:1.75;background:var(--bg3);border-radius:7px;padding:14px;margin-bottom:14px;white-space:pre-wrap">${esc(m.body)}</div>
      <div class="input-label">Reply</div>
      <textarea id="reply-text" placeholder="Type your reply…" style="min-height:80px;margin-bottom:8px"></textarea>
      <div style="display:flex;gap:6px">
        <button class="btn btn-primary" onclick="sendTrainerReply('${m.id}')">Send Reply</button>
        <button class="btn" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>`);
}

function openCompose(){
  document.body.insertAdjacentHTML('beforeend',`<div class="overlay" id="compose-modal" onclick="if(event.target.id==='compose-modal')closeModal()">
    <div class="modal">
      <div class="flex-between" style="margin-bottom:14px"><div class="modal-title">New Message</div><button class="btn btn-sm" onclick="closeModal()">✕</button></div>
      <div class="input-group"><div class="input-label">To</div>
        <select id="compose-to">${MY_FOUNDERS.map(f=>`<option>${esc(f.name)} (Founder)</option>`).join('')}<option>Sushma (Admin)</option><option>Rajiv Nair (Trainer)</option></select>
      </div>
      <div class="input-group"><div class="input-label">Subject</div><input type="text" id="compose-subj" placeholder="Session notes, check-in, resource share…"></div>
      <div class="input-group"><div class="input-label">Message</div><textarea id="compose-body" style="min-height:120px" placeholder="Write your message…"></textarea></div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-primary" onclick="sendCompose()">Send</button>
        <button class="btn" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>`);
}

function openComposeTo(fId,fName){
  document.body.insertAdjacentHTML('beforeend',`<div class="overlay" id="compose-modal" onclick="if(event.target.id==='compose-modal')closeModal()">
    <div class="modal">
      <div class="flex-between" style="margin-bottom:14px"><div class="modal-title">Message ${esc(fName)}</div><button class="btn btn-sm" onclick="closeModal()">✕</button></div>
      <div class="input-group"><div class="input-label">To</div><input type="text" id="compose-to" value="${esc(fName)}" readonly style="background:var(--bg4)"></div>
      <div class="input-group"><div class="input-label">Subject</div><input type="text" id="compose-subj" placeholder="Session update, resource, feedback…"></div>
      <div class="input-group"><div class="input-label">Message</div><textarea id="compose-body" style="min-height:120px" placeholder="Write your message…"></textarea></div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-primary" onclick="sendCompose()">Send</button>
        <button class="btn" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>`);
}

// Save an outgoing message to the Sent box (delivered via the backend in Phase 4)
function storeSent(to, subject, body){
  SENT_MSGS.unshift({ id:'s_'+Date.now(), type:'sent', to, subject: subject || '(no subject)', body, time: new Date().toLocaleString() });
  saveTrainerData();
}
function sendCompose(){
  const to=val('compose-to'), subject=val('compose-subj'), body=val('compose-body');
  if(!body){ showToast('Write a message first', false); document.getElementById('compose-body')?.focus(); return; }
  storeSent(to.replace(/ \((Founder|Admin|Trainer)\)$/,''), subject, body);
  closeModal(); showToast('Message saved to Sent ✓');
  if(state.panel==='inbox') refreshPanel();
}
function sendTrainerReply(msgId){
  const m=INBOX_MSGS.find(x=>x.id===msgId); if(!m) return;
  const body=val('reply-text');
  if(!body){ showToast('Write a reply first', false); document.getElementById('reply-text')?.focus(); return; }
  storeSent(m.from, 'Re: '+m.subject, body);
  closeModal(); showToast('Reply saved to Sent ✓');
  if(state.panel==='inbox') refreshPanel();
}

function openSessionNotes(fId){
  const f=MY_FOUNDERS.find(x=>x.id===fId);if(!f)return;
  const saved=localStorage.getItem('prep_'+fId)||'';
  const nextS=UPCOMING_SESSIONS.find(s=>s.founderId===fId);
  document.body.insertAdjacentHTML('beforeend',`<div class="overlay" id="snotes-modal" onclick="if(event.target.id==='snotes-modal')closeModal()">
    <div class="modal">
      <div class="flex-between" style="margin-bottom:14px"><div class="modal-title">Session Prep — ${esc(f.name)}</div><button class="btn btn-sm" onclick="closeModal()">✕</button></div>
      ${nextS?`<div class="alert alert-info" style="margin-bottom:12px">Next session: ${esc(nextS.type)} · ${esc(nextS.date)} · ${esc(nextS.time)}</div>`:''}
      <div class="input-group"><div class="input-label">Prep Notes</div>
        <textarea id="prep-note-${fId}" style="min-height:130px" placeholder="What to cover, questions to ask, roleplay scenarios to run…">${esc(saved)}</textarea>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-primary" onclick="savePrepNote('${fId}')">Save</button>
        <button class="btn" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>`);
}

function savePrepNote(fId){
  const el=document.getElementById('prep-note-'+fId);
  if(el){localStorage.setItem('prep_'+fId,el.value);closeModal();showToast('Prep notes saved ✓');}
}

let sessionFormRating = 0;
function setSessionRating(n){
  sessionFormRating = n;
  document.querySelectorAll('#sf-rating .btn').forEach((b,i)=>{ b.style.opacity = i+1===n ? '1' : '.4'; });
}
function openSessionForm(sId){
  const s=UPCOMING_SESSIONS.find(x=>x.id===sId);if(!s)return;
  sessionFormRating = 0;
  document.body.insertAdjacentHTML('beforeend',`<div class="overlay" id="sf-modal" onclick="if(event.target.id==='sf-modal')closeModal()">
    <div class="modal">
      <div class="flex-between" style="margin-bottom:14px"><div class="modal-title">▶ ${esc(s.type)} — ${esc(s.founder)}</div><button class="btn btn-sm" onclick="closeModal()">✕</button></div>
      <div class="alert alert-ok" style="margin-bottom:12px">Session started · ${new Date().toLocaleTimeString()}</div>
      <div class="input-group"><div class="input-label">Rating</div>
        <div id="sf-rating" style="display:flex;gap:6px;margin-top:2px">${[1,2,3,4,5].map(n=>`<button class="btn btn-sm" onclick="setSessionRating(${n})">${'⭐'.repeat(n)}</button>`).join('')}</div>
      </div>
      <div class="input-group"><div class="input-label">Session Notes</div><textarea id="sf-notes" style="min-height:90px" placeholder="Key observations, founder wins, areas to work on…"></textarea></div>
      <div class="input-group"><div class="input-label">Action Items (for founder)</div><textarea id="sf-actions" style="min-height:60px" placeholder="What must the founder do before next session?"></textarea></div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-primary" onclick="completeSession('${s.id}')">Complete Session</button>
        <button class="btn" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>`);
}
function completeSession(sId){
  const idx=UPCOMING_SESSIONS.findIndex(x=>x.id===sId); if(idx<0) return;
  if(!sessionFormRating){ showToast('Pick a rating (1–5 stars)', false); return; }
  const s=UPCOMING_SESSIONS[idx];
  const f=MY_FOUNDERS.find(x=>x.id===s.founderId);
  const notes=val('sf-notes'), actions=val('sf-actions');
  if(f) f.sessions.push({ date:new Date().toISOString().slice(0,10), type:s.type, duration:s.duration, notes:[notes, actions&&('Actions: '+actions)].filter(Boolean).join(' · ') || '—', rating:sessionFormRating });
  UPCOMING_SESSIONS.splice(idx,1);
  saveTrainerData();
  closeModal(); showToast('Session completed and logged ✓');
  refreshNav(); refreshPanel();
}

function scheduleSession(fId,fName){
  document.body.insertAdjacentHTML('beforeend',`<div class="overlay" id="sched-modal" onclick="if(event.target.id==='sched-modal')closeModal()">
    <div class="modal">
      <div class="flex-between" style="margin-bottom:14px"><div class="modal-title">Schedule New Session</div><button class="btn btn-sm" onclick="closeModal()">✕</button></div>
      <div class="input-group"><div class="input-label">Founder</div>
        <select id="sched-founder">${MY_FOUNDERS.map(f=>`<option value="${f.id}" ${f.id===fId?'selected':''}>${esc(f.name)}</option>`).join('')}</select>
      </div>
      <div class="input-group"><div class="input-label">Session Type</div>
        <select id="sched-type"><option>SPARC™ Roleplay</option><option>Script Review</option><option>Pricing Workshop</option><option>Progress Check-in</option><option>VSL Critique</option></select>
      </div>
      <div class="grid-2">
        <div class="input-group"><div class="input-label">Date & Time</div><input type="datetime-local" id="sched-dt"></div>
        <div class="input-group"><div class="input-label">Duration</div><select id="sched-dur"><option value="30">30 min</option><option value="45">45 min</option><option value="60" selected>60 min</option><option value="90">90 min</option></select></div>
      </div>
      <div class="input-group"><div class="input-label">Prep Note for Founder</div><textarea id="sched-prep" placeholder="What should the founder prepare?"></textarea></div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-primary" onclick="saveScheduledSession()">Schedule</button>
        <button class="btn" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>`);
}
function saveScheduledSession(){
  const f=MY_FOUNDERS.find(x=>x.id===val('sched-founder'));
  const dtRaw=val('sched-dt');
  if(!f){ showToast('Choose a founder', false); return; }
  if(!dtRaw){ showToast('Choose a date and time', false); document.getElementById('sched-dt')?.focus(); return; }
  const dt=new Date(dtRaw);
  UPCOMING_SESSIONS.push({ id:'s_'+Date.now(), founder:f.name, founderId:f.id, type:val('sched-type')||'Session', date:fmtDate(dt), time:fmtTime(dt), when:dt.toISOString(), duration:parseInt(val('sched-dur')||'60'), prep:val('sched-prep')||'—', status:'pending' });
  saveTrainerData();
  closeModal(); showToast('Session scheduled ✓ (founder notification arrives with the backend)');
  refreshNav(); if(state.panel==='sessions'||state.panel==='dashboard') refreshPanel();
}

function confirmSession(sId){
  const s=UPCOMING_SESSIONS.find(x=>x.id===sId);
  if(s){s.status='confirmed';saveTrainerData();refreshNav();go('sessions');showToast('Session confirmed ✓');}
}

function closeModal(){
  const m=document.querySelector('.overlay');if(m)m.remove();
}

function showToast(msg,ok=true){
  const t=document.createElement('div');
  t.className='toast';
  t.style.cssText=`background:${ok?'var(--gnbg)':'var(--rebg)'};border:1px solid ${ok?'rgba(0,230,118,.3)':'rgba(239,83,80,.3)'};color:${ok?'var(--grn)':'var(--red)'}`;
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300);},2500);
}

const _fns={go,toggleTrainerTheme,toggleCheck,saveMentorNote,setRating,setEscalate,
  openFounderDetail,openMessage,openCompose,openComposeTo,openSessionNotes,savePrepNote,
  openSessionForm,scheduleSession,confirmSession,closeModal,showToast,
  setSessTab,setInboxTab,refreshPanel,setFocusFounder,setPlanFounder,openProgressFor,
  saveFeedback,sendCompose,sendTrainerReply,setSessionRating,completeSession,saveScheduledSession};
Object.keys(_fns).forEach(k=>{window[k]=_fns[k];});

function boot(){
  const app=document.getElementById('app');
  app.innerHTML=renderSidebar()+`<div class="main">${renderTopbar()}<div class="content" id="content"></div></div>`;
  contentEl=document.getElementById('content');
  go('dashboard');
  themeSystem.apply(themeSystem.current,false);
}
document.addEventListener('DOMContentLoaded',boot);
})();

</script>
</body>
</html>
