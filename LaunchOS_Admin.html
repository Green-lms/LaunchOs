<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaunchOS™ Admin & Mentor Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Cabinet+Grotesk:wght@300;400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── LaunchOS Admin Portal ── */
:root {
  --bg:#07080c;--bg2:#0d0f18;--bg3:#131620;--bg4:#191d28;--bg5:#202535;
  --br:#1e2335;--br2:#2a3050;--br3:#374060;
  --t:#e4e8f5;--t2:#8892b0;--t3:#4a5580;--t4:#2e3655;
  --acc:#6c5ce7;--acc2:#a29bfe;--accbg:rgba(108,92,231,.12);
  --grn:#00e676;--gnbg:rgba(0,230,118,.1);
  --amb:#ffca28;--ambg:rgba(255,202,40,.1);
  --cor:#ff7043;--cobg:rgba(255,112,67,.1);
  --blu:#2979ff;--blbg:rgba(41,121,255,.1);
  --tel:#26c6da;--tebg:rgba(38,198,218,.1);
  --pnk:#f06292;--pkbg:rgba(240,98,146,.1);
  --red:#ef5350;--rebg:rgba(239,83,80,.1);
  --gld:#ffd740;--gobg:rgba(255,215,64,.1);
  --font-display:'Syne',sans-serif;--font-body:'Cabinet Grotesk',sans-serif;--font-mono:'JetBrains Mono',monospace;
}
html[data-theme="light"] {
  --bg:#f5f6fa;--bg2:#fff;--bg3:#eef0f7;--bg4:#e4e7f2;--bg5:#d8dcee;
  --br:#dde1f0;--br2:#c8ceea;--br3:#b0b8e0;
  --t:#111827;--t2:#374151;--t3:#6b7280;--t4:#9ca3af;
  --acc:#6c5ce7;--acc2:#5b4bd4;--accbg:rgba(108,92,231,.1);
  --grn:#00a854;--gnbg:rgba(0,168,84,.1);
  --amb:#c88a00;--ambg:rgba(200,138,0,.1);
  --cor:#e84e2a;--cobg:rgba(232,78,42,.1);
  --red:#dc2626;--rebg:rgba(220,38,38,.1);
  --gld:#d97706;--gobg:rgba(217,119,6,.1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-body);background:var(--bg);color:var(--t);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:var(--font-body)}
input,textarea,select{font-family:var(--font-body)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--br2);border-radius:2px}
#app{display:flex;height:100vh;overflow:hidden}

/* Sidebar */
.sidebar{width:220px;min-width:220px;background:var(--bg2);border-right:1px solid var(--br);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:16px;border-bottom:1px solid var(--br)}
.brand-logo{font-family:var(--font-display);font-size:17px;font-weight:800;background:linear-gradient(135deg,#ff7043,#ffd740);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.brand-role{font-family:var(--font-mono);font-size:9px;color:var(--t3);margin-top:2px;text-transform:uppercase;letter-spacing:.1em}
.nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-grp{font-family:var(--font-mono);font-size:9px;color:var(--t4);padding:10px 14px 3px;letter-spacing:.1em;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 12px 7px 14px;font-size:12px;font-weight:500;color:var(--t2);border-left:2px solid transparent;transition:all .12s;cursor:pointer;user-select:none}
.nav-item:hover{background:var(--bg3);color:var(--t)}
.nav-item.active{background:var(--accbg);color:var(--acc2);border-left-color:var(--acc)}
.nav-icon{width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.nav-badge{margin-left:auto;font-family:var(--font-mono);font-size:8px;padding:2px 5px;border-radius:3px;background:var(--bg4);color:var(--t3)}
.nav-badge.warn{background:var(--ambg);color:var(--amb)}
.nav-badge.ok{background:var(--gnbg);color:var(--grn)}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:52px;background:var(--bg2);border-bottom:1px solid var(--br);display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0}
.topbar-title{font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--t);flex:1}
.content{flex:1;overflow-y:auto;padding:20px;background:var(--bg)}
.panel{display:none;animation:fadeIn .2s ease}
.panel.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Cards */
.card{background:var(--bg2);border:1px solid var(--br);border-radius:9px;padding:16px;margin-bottom:10px}
.card-title{font-family:var(--font-display);font-size:13px;font-weight:700;color:var(--t);margin-bottom:3px}
.card-sub{font-size:11px;color:var(--t3);margin-bottom:12px;line-height:1.55}
.sl{font-family:var(--font-mono);font-size:9px;font-weight:500;color:var(--t3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}

/* Metrics */
.mrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.met{background:var(--bg2);border:1px solid var(--br);border-radius:9px;padding:12px}
.met-label{font-family:var(--font-mono);font-size:9px;color:var(--t3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
.met-val{font-family:var(--font-mono);font-size:22px;font-weight:500;margin-bottom:2px}
.met-sub{font-size:10px;color:var(--t3)}

/* Buttons */
.btn{font-family:var(--font-body);font-size:12px;font-weight:500;padding:7px 14px;border-radius:6px;border:1px solid var(--br2);background:var(--bg4);color:var(--t2);cursor:pointer;transition:all .12s;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:var(--bg5);color:var(--t)}
.btn-primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn-primary:hover{background:#7c6cf0;color:#fff}
.btn-success{background:var(--gnbg);border-color:rgba(0,230,118,.3);color:var(--grn)}
.btn-warn{background:var(--ambg);border-color:rgba(255,202,40,.3);color:var(--amb)}
.btn-sm{font-size:11px;padding:4px 10px}
.btn-a{background:var(--accbg);border-color:rgba(108,92,231,.3);color:var(--acc2);font-weight:600}

/* Inputs */
input[type="text"],input[type="email"],input[type="password"],input[type="number"],input[type="datetime-local"],input[type="search"],select,textarea{
  width:100%;background:var(--bg3);border:1px solid var(--br);border-radius:5px;color:var(--t);font-size:12px;padding:7px 10px;outline:none;transition:border-color .12s;appearance:none;font-family:var(--font-body)
}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:72px;line-height:1.6}
.input-label{font-size:9px;font-weight:500;color:var(--t3);margin-bottom:3px;font-family:var(--font-mono);letter-spacing:.06em;text-transform:uppercase}
.input-group{margin-bottom:8px}

/* Tables */
.data-table{width:100%;border-collapse:collapse;font-size:11px}
.data-table th{background:var(--bg4);color:var(--t2);padding:8px 10px;text-align:left;font-weight:600;font-size:10px;letter-spacing:.05em;text-transform:uppercase}
.data-table td{padding:8px 10px;border-bottom:1px solid var(--br);color:var(--t2)}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:var(--bg3)}

/* Tags */
.tag{font-family:var(--font-mono);font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;display:inline-block;margin:2px}
.tag-grn{background:var(--gnbg);color:var(--grn)}
.tag-amb{background:var(--ambg);color:var(--amb)}
.tag-cor{background:var(--cobg);color:var(--cor)}
.tag-acc{background:var(--accbg);color:var(--acc2)}
.tag-red{background:var(--rebg);color:var(--red)}
.tag-tel{background:var(--tebg);color:var(--tel)}

/* Progress bar */
.prog-bar{height:5px;background:var(--bg5);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .5s ease}

/* Tab rows */
.tab-row{display:flex;border:1px solid var(--br);border-radius:6px;overflow:hidden;margin-bottom:12px;background:var(--bg2)}
.tab-btn{flex:1;font-size:11px;font-weight:500;padding:7px 4px;cursor:pointer;background:none;border:none;color:var(--t3);transition:all .12s;text-align:center;font-family:var(--font-body)}
.tab-btn:hover{background:var(--bg3);color:var(--t2)}
.tab-btn.active{background:var(--accbg);color:var(--acc2)}

/* Grid */
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.flex-row{display:flex;align-items:center;gap:8px}
.flex-between{display:flex;align-items:center;justify-content:space-between}

/* Message/Inbox */
.msg-list{display:flex;flex-direction:column;gap:4px}
.msg-item{display:flex;gap:10px;padding:10px 12px;background:var(--bg3);border-radius:7px;border:1px solid var(--br);cursor:pointer;transition:all .12s}
.msg-item:hover{border-color:var(--br2);background:var(--bg4)}
.msg-item.unread{border-left:3px solid var(--acc)}
.msg-avatar{width:34px;height:34px;border-radius:50%;background:var(--accbg);color:var(--acc2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.msg-preview{flex:1;min-width:0}
.msg-name{font-size:12px;font-weight:600;color:var(--t);margin-bottom:2px}
.msg-text{font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-meta{font-family:var(--font-mono);font-size:9px;color:var(--t4);text-align:right;white-space:nowrap;flex-shrink:0}

/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-day{padding:6px 4px;border-radius:5px;text-align:center;font-size:11px;cursor:pointer;transition:all .12s;border:1px solid transparent;min-height:56px;vertical-align:top}
.cal-day:hover{background:var(--bg3);border-color:var(--br)}
.cal-day.today{background:var(--accbg);border-color:var(--acc);color:var(--acc2)}
.cal-day.has-event{border-color:var(--grn)}
.cal-day-num{font-weight:600;color:var(--t2);margin-bottom:3px}
.cal-event-dot{width:5px;height:5px;border-radius:50%;background:var(--acc);margin:1px auto}
.cal-header{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-bottom:4px}
.cal-header-day{text-align:center;font-family:var(--font-mono);font-size:9px;font-weight:600;color:var(--t3);padding:3px 0;text-transform:uppercase}

/* Appointment slots */
.slot{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--bg3);border:1px solid var(--br);border-radius:6px;margin-bottom:5px;cursor:pointer;transition:all .12s}
.slot:hover{border-color:var(--acc);background:var(--accbg)}
.slot-time{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--acc2);width:80px;flex-shrink:0}
.slot-info{flex:1;font-size:11px;color:var(--t2)}
.slot-badge{font-family:var(--font-mono);font-size:8px;padding:2px 6px;border-radius:3px;flex-shrink:0}

/* Founder card */
.founder-card{background:var(--bg2);border:1px solid var(--br);border-radius:9px;padding:14px;cursor:pointer;transition:all .15s}
.founder-card:hover{border-color:var(--br2);background:var(--bg3)}
.founder-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0;background:var(--accbg);color:var(--acc2)}
.founder-name{font-size:13px;font-weight:700;color:var(--t);margin-bottom:2px}
.founder-meta{font-size:10px;color:var(--t3)}

/* Email compose */
.compose-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9999}
.compose-box{background:var(--bg2);border:1px solid var(--br2);border-radius:12px;padding:24px;width:560px;max-width:95vw;max-height:90vh;overflow-y:auto}
.email-providers{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.email-provider-btn{padding:6px 12px;border-radius:6px;border:1px solid var(--br);background:var(--bg3);color:var(--t2);cursor:pointer;font-size:11px;font-weight:500;display:flex;align-items:center;gap:5px;transition:all .12s}
.email-provider-btn:hover{border-color:var(--acc);color:var(--acc2)}
.email-provider-btn.active{background:var(--accbg);border-color:var(--acc);color:var(--acc2)}

/* Thinking */
.thinking{color:var(--t3);font-style:italic;font-size:11px}
.thinking::after{content:'';display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--acc2);animation:pulse 1.2s ease infinite;margin-left:6px}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

/* Theme toggle */
.theme-toggle{display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--br);border-radius:20px;padding:4px 10px;cursor:pointer;font-family:var(--font-mono);font-size:10px;color:var(--t2);transition:all .2s;user-select:none}
.toggle-track{width:28px;height:15px;background:var(--br2);border-radius:8px;position:relative;transition:background .2s;flex-shrink:0}
.toggle-thumb{width:11px;height:11px;background:var(--t2);border-radius:50%;position:absolute;top:2px;left:2px;transition:all .2s}
html[data-theme="light"] .toggle-track{background:var(--acc)}
html[data-theme="light"] .toggle-thumb{left:15px;background:#fff}

@media (max-width:768px){.sidebar{width:52px;min-width:52px}.sidebar .brand-role,.sidebar .nav-grp,.sidebar .nav-item span:not(.nav-icon),.sidebar .nav-badge{display:none}.nav-item{justify-content:center;padding:8px}.mrow{grid-template-columns:1fr 1fr}}
</style>
</head>

<div id="app"></div>
<script>
(function(){
'use strict';

// ═══════════════════════════════════════════════════════════
// LaunchOS™ Admin & Mentor Portal
// Roles: admin | mentor
// ═══════════════════════════════════════════════════════════

// ── Theme ────────────────────────────────────────────────
const THEME_KEY = 'los_admin_theme';
const themeSystem = {
  current: localStorage.getItem(THEME_KEY) || 'dark',
  init() { this.apply(this.current, false); },
  apply(t, save=true) {
    this.current = t;
    document.documentElement.setAttribute('data-theme', t);
    if (save) localStorage.setItem(THEME_KEY, t);
    const icon = document.getElementById('theme-icon');
    const lbl  = document.getElementById('theme-label');
    if (icon) icon.textContent = t === 'light' ? '☀️' : '🌙';
    if (lbl)  lbl.textContent  = t === 'light' ? 'Light' : 'Dark';
  },
  toggle() { this.apply(this.current === 'dark' ? 'light' : 'dark'); }
};
themeSystem.init();
window.toggleAdminTheme = () => themeSystem.toggle();

// ── Portal State ─────────────────────────────────────────
const portalState = {
  role:         localStorage.getItem('los_portal_role') || 'admin',
  currentPanel: 'dashboard',
  currentFounder: null,
  messages:     JSON.parse(localStorage.getItem('los_msgs') || '[]'),
  appointments: JSON.parse(localStorage.getItem('los_appts') || '[]'),
  emailProvider: localStorage.getItem('los_email_prov') || '',
  emailConnected: false,
  composeOpen:  false,
  calMonth:     new Date().getMonth(),
  calYear:      new Date().getFullYear(),

  saveMessages() { localStorage.setItem('los_msgs', JSON.stringify(this.messages)); },
  saveAppts()    { localStorage.setItem('los_appts', JSON.stringify(this.appointments)); },

  get isAdmin()  { return this.role === 'admin'; },
  get isMentor() { return this.role === 'mentor'; },
};

// ── Demo Data ─────────────────────────────────────────────
const DEMO_FOUNDERS = [
  { id:'f1', name:'Arjun Sharma', email:'arjun@startup.in', business:'EdTech platform for Tier-2 cities', stage:6, bmcPct:85, assessScore:72, surveyResp:45, lastActive:'2h ago', status:'active', city:'Hyderabad', avatar:'AS' },
  { id:'f2', name:'Priya Mehta', email:'priya@ventures.co', business:'D2C organic skincare brand', stage:9, bmcPct:100, assessScore:88, surveyResp:100, lastActive:'1d ago', status:'graduated', city:'Mumbai', avatar:'PM' },
  { id:'f3', name:'Rahul Gupta', email:'rahul@scale.io', business:'B2B SaaS for HR teams', stage:4, bmcPct:60, assessScore:65, surveyResp:12, lastActive:'3d ago', status:'at-risk', city:'Bengaluru', avatar:'RG' },

  { id:'f5', name:'Kiran Rao', email:'kiran@fintech.in', business:'Micro-lending for MSMEs', stage:7, bmcPct:90, assessScore:82, surveyResp:78, lastActive:'6h ago', status:'active', city:'Pune', avatar:'KR' },
  { id:'f6', name:'Divya Singh', email:'divya@health.co', business:'Mental health app for corporates', stage:5, bmcPct:75, assessScore:79, surveyResp:55, lastActive:'12h ago', status:'active', city:'Delhi', avatar:'DS' },

const DEMO_MESSAGES = [
  { id:'m1', from:'Arjun Sharma', fromId:'f1', to:'mentor', subject:'SPARC™ script review needed', body:'Hi, I\'ve completed my SPARC™ script using the BMC. Could you review the Amplify and Resolve stages? I\'m not sure I\'ve captured the cost of inaction correctly.', time:'2h ago', unread:true, avatar:'AS' },
  { id:'m2', from:'Priya Mehta', fromId:'f2', to:'mentor', subject:'Survey results — ready for analysis', body:'We\'ve hit 100 responses! The validation is strong — 68% said definitely yes. Can we schedule a call to review before I move to offer design?', time:'1d ago', unread:true, avatar:'PM' },
  { id:'m3', from:'Rahul Gupta', fromId:'f3', to:'admin', subject:'Need help — stuck on pricing', body:'I\'m struggling with the 3-tier pricing. My B2B SaaS pricing is very different from service pricing. Can someone guide me?', time:'3d ago', unread:false, avatar:'RG' },
  { id:'m4', from:'Kiran Rao', fromId:'f5', to:'mentor', subject:'Moodle course access issue', body:'I cannot access Week 3 content on the LMS. It says I\'m not enrolled. Could you check my enrolment?', time:'6h ago', unread:true, avatar:'KR' },
];

const DEMO_APPTS = [
  { id:'a1', founderId:'f1', founderName:'Arjun Sharma', type:'Script Review', date:'2026-03-25', time:'10:00', duration:45, status:'confirmed', notes:'Review SPARC™ Amplify + Resolve stages' },
  { id:'a2', founderId:'f2', founderName:'Priya Mehta', type:'Progress Call', date:'2026-03-26', time:'14:00', duration:30, status:'confirmed', notes:'Survey results review and offer design kickoff' },
  { id:'a3', founderId:'f5', founderName:'Kiran Rao', type:'Discovery Call Practice', date:'2026-03-28', time:'11:00', duration:60, status:'pending', notes:'Practice discovery call with mentor playing prospect' },
  { id:'a4', founderId:'f3', founderName:'Rahul Gupta', type:'Pricing Workshop', date:'2026-04-01', time:'15:00', duration:45, status:'pending', notes:'B2B SaaS pricing strategy session' },
];

// Merge demo data if empty
if (portalState.messages.length === 0) {
  portalState.messages = DEMO_MESSAGES;
  portalState.saveMessages();
}
if (portalState.appointments.length === 0) {
  portalState.appointments = DEMO_APPTS;
  portalState.saveAppts();
}


// ── Trainer / Mentor Data ────────────────────────────────
const DEMO_TRAINERS = [
  { id:'t1', name:'Dr. Meera Iyer',     email:'meera@launchos.in',   role:'mentor',  specialty:'Sales & SPARC™',       cohorts:['c1'],         founders:['f1','f6'],    sessions:14, rating:4.9, city:'Bengaluru', avatar:'MI', phone:'+91 98765 11111', status:'active',  joinDate:'2025-10-01', bio:'Former head of sales at Byjus. Specialises in SPARC™ sales coaching and high-ticket closing.' },

  { id:'t3', name:'Ananya Krishnan',    email:'ananya@launchos.in',  role:'mentor',  specialty:'Marketing & VSL',      cohorts:['c2'],         founders:['f4','f5'],    sessions:9,  rating:4.8, city:'Chennai',   avatar:'AK', phone:'+91 98765 33333', status:'active',  joinDate:'2025-11-01', bio:'Digital marketing expert, former VP Marketing at MakeMyTrip. VSL and funnel specialist.' },
  { id:'t4', name:'Sanjay Verma',       email:'sanjay@launchos.in',  role:'trainer', specialty:'Finance & Capital',    cohorts:['c3'],         founders:[],             sessions:6,  rating:4.6, city:'Delhi',     avatar:'SV', phone:'+91 98765 44444', status:'active',  joinDate:'2026-01-10', bio:'CFO background, startup finance advisor. Specialises in capital planning and investor readiness.' },
  { id:'t5', name:'Preethi Subramaniam',email:'preethi@launchos.in', role:'mentor',  specialty:'MVP & Market Validation', cohorts:[],           founders:[],             sessions:0,  rating:null,city:'Hyderabad',avatar:'PS', phone:'+91 98765 55555', status:'onboarding',joinDate:'2026-03-15', bio:'Product manager, ex-Flipkart. Expert in MVP validation, customer discovery, and lean startup.' },

          <div style="font-size:14px;font-weight:700;color:var(--t)">${m.subject}</div>

        <div style="display:flex;gap:6px">
          <button class="btn btn-sm btn-a" onclick="replyToMessage('${m.id}')">↩ Reply</button>
          <button class="btn btn-sm" onclick="bookApptFromMsg('${m.fromId}','${m.from}')">📅 Book call</button>
        </div>
      </div>
      <div style="font-size:12px;color:var(--t2);line-height:1.7;padding:12px;background:var(--bg3);border-radius:7px;margin-bottom:12px">${m.body}</div>

// PANEL: CALENDAR
// ═══════════════════════════════════════════════════════════
function renderCalendar() {
  const year  = portalState.calYear;
  const month = portalState.calMonth;
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const dayNames   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const firstDay   = new Date(year, month, 1).getDay();
  const daysInMonth= new Date(year, month+1, 0).getDate();
  const today      = new Date();

  // Map appointments to dates
  const apptMap = {};
  portalState.appointments.forEach(a => {
    const key = a.date;
    if (!apptMap[key]) apptMap[key] = [];
    apptMap[key].push(a);
  });

  let cells = [];
  for (let i = 0; i < firstDay; i++) cells.push('<div></div>');
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = d===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
    const appts   = apptMap[dateStr] || [];
    cells.push(`
      <div class="cal-day ${isToday?'today':''} ${appts.length?'has-event':''}" onclick="openCalDay('${dateStr}')">
        <div class="cal-day-num">${d}</div>
        ${appts.slice(0,2).map(a=>`<div style="font-size:8px;padding:1px 3px;border-radius:2px;background:${a.status==='confirmed'?'var(--gnbg)':'var(--ambg)'};color:${a.status==='confirmed'?'var(--grn)':'var(--amb)'};margin-top:1px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${a.founderName.split(' ')[0]}</div>`).join('')}
        ${appts.length>2?`<div style="font-size:8px;color:var(--t3)">+${appts.length-2}</div>`:''}
      </div>`);
  }

  return `
    <div class="card">
      <div class="flex-between" style="margin-bottom:14px">
        <button class="btn btn-sm" onclick="calNav(-1)">← Prev</button>
        <div style="font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--t)">${monthNames[month]} ${year}</div>
        <button class="btn btn-sm" onclick="calNav(1)">Next →</button>
      </div>
      <div class="cal-header">
        ${dayNames.map(d=>`<div class="cal-header-day">${d}</div>`).join('')}
      </div>
      <div class="cal-grid">${cells.join('')}</div>
    </div>

    <div class="card">
      <div class="card-title">This month's appointments</div>
      ${portalState.appointments.filter(a=>a.date.startsWith(`${year}-${String(month+1).padStart(2,'0')}`)).map(a=>`
        <div class="slot">
          <div class="slot-time">${a.date.slice(8)} ${a.time}</div>
          <div class="slot-info">
            <div style="font-weight:600;font-size:12px;color:var(--t)">${a.founderName}</div>
            <div style="font-size:10px;color:var(--t3)">${a.type} · ${a.duration}min · ${a.notes||''}</div>
          </div>
          <span class="slot-badge tag ${a.status==='confirmed'?'tag-grn':'tag-amb'}">${a.status}</span>
        </div>`).join('') || '<div style="color:var(--t3);font-size:12px;padding:10px">No appointments this month</div>'}
    </div>`;
}

let activeTrainerMsg = null;

function renderTrainerComm() {
  const trainerMsgs = portalState.messages.filter(m => m.type === 'trainer' || DEMO_TRAINERS.find(t=>t.id===m.fromId));
  const unread = trainerMsgs.filter(m=>m.unread).length;

  return `
    <div class="mrow" style="grid-template-columns:repeat(3,1fr)">
      <div class="met" style="color:var(--pnk)"><div class="met-label">Unread</div><div class="met-val" style="color:var(--pnk)">${unread}</div><div class="met-sub">from trainers</div></div>
      <div class="met" style="color:var(--tel)"><div class="met-label">Team Messages</div><div class="met-val" style="color:var(--tel)">${trainerMsgs.length}</div><div class="met-sub">total thread</div></div>
      <div class="met" style="color:var(--grn)"><div class="met-label">Active Trainers</div><div class="met-val" style="color:var(--grn)">${DEMO_TRAINERS.filter(t=>t.status==='active').length}</div><div class="met-sub">online team</div></div>
    </div>

    <div style="display:grid;grid-template-columns:280px 1fr;gap:12px">
      <!-- Trainer list + channel buttons -->
      <div>
        <div class="sl">Your team</div>
        ${DEMO_TRAINERS.map(t => {
          const unreadFromT = portalState.messages.filter(m=>m.fromId===t.id&&m.unread).length;
          const roleColor   = t.role==='mentor'?'var(--pnk)':'var(--tel)';
          const roleBg      = t.role==='mentor'?'var(--pkbg)':'var(--tebg)';
          return `
            <div class="msg-item ${unreadFromT?'unread':''}" onclick="openTrainerChannel('${t.id}')"
              style="${activeTrainerMsg===t.id?'border-color:var(--acc);background:var(--accbg)':''}">
              <div class="msg-avatar" style="background:${roleBg};color:${roleColor}">${t.avatar}</div>
              <div class="msg-preview">
                <div class="msg-name">${t.name}</div>
                <div class="msg-text">${t.specialty}</div>
              </div>
              <div class="msg-meta">
                ${unreadFromT?`<span style="background:var(--acc);color:#fff;border-radius:50%;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;font-size:9px">${unreadFromT}</span>`:''}
                <div style="font-size:9px;color:var(--t3)">${t.sessions} sessions</div>
              </div>
            </div>`;
        }).join('')}

        <div style="margin-top:10px">
          <div class="sl">Broadcast</div>
          <button class="btn btn-a" style="width:100%;margin-bottom:6px" onclick="broadcastToAll()">📢 Message all trainers</button>
          <button class="btn btn-sm" style="width:100%" onclick="broadcastCohort()">📢 Message by cohort</button>
        </div>
      </div>

      <!-- Message thread -->
      <div id="trainer-thread">
        ${activeTrainerMsg ? renderTrainerThread(activeTrainerMsg) : `
          <div class="card" style="text-align:center;padding:40px">
            <div style="font-size:28px;margin-bottom:8px">💬</div>
            <div class="card-title">Select a trainer to open channel</div>
            <div class="card-sub">Private communication channel between you and each trainer/mentor</div>
          </div>`}
      </div>
    </div>`;
}

function renderTrainerThread(trainerId) {
  const t = DEMO_TRAINERS.find(x=>x.id===trainerId);
  if (!t) return '';
  const msgs = portalState.messages.filter(m=>m.fromId===trainerId||m.to===t.name).sort((a,b)=>a.id.localeCompare(b.id));
  const roleColor = t.role==='mentor'?'var(--pnk)':'var(--tel)';
  const roleBg    = t.role==='mentor'?'var(--pkbg)':'var(--tebg)';
  return `
    <div class="card" style="display:flex;flex-direction:column;height:480px;padding:0;overflow:hidden">
      <!-- Thread header -->
      <div style="padding:12px 16px;border-bottom:1px solid var(--br);display:flex;align-items:center;gap:10px;background:var(--bg3)">
        <div style="width:36px;height:36px;border-radius:50%;background:${roleBg};color:${roleColor};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">${t.avatar}</div>
        <div style="flex:1">
          <div style="font-size:12px;font-weight:700;color:var(--t)">${t.name}</div>
          <div style="font-size:10px;color:var(--t3)">${t.role} · ${t.specialty} · ${t.city}</div>
        </div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-sm" onclick="emailTrainer('${t.email}','${t.name}')">📧 Email</button>
          <button class="btn btn-sm" onclick="bookApptTrainer('${t.id}','${t.name}')">📅 Schedule</button>
          <button class="btn btn-sm btn-a" onclick="navigate('trainers')">View profile</button>
        </div>
      </div>

      <!-- Messages -->
      <div id="trainer-chat-msgs" style="flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px">
        ${msgs.length ? msgs.map(m => {
          const isFrom = m.fromId === trainerId;
          return `
            <div style="display:flex;flex-direction:column;align-items:${isFrom?'flex-start':'flex-end'}">
              <div style="font-size:9px;color:var(--t4);margin-bottom:2px">${isFrom?t.name:'You'} · ${m.time}</div>
              <div style="max-width:80%;padding:9px 12px;border-radius:${isFrom?'4px 12px 12px 12px':'12px 4px 12px 12px'};
                background:${isFrom?'var(--bg3)':'var(--accbg)'};
                border:1px solid ${isFrom?'var(--br)':'rgba(108,92,231,.2)'};
                color:${isFrom?'var(--t)':'var(--acc2)'};font-size:12px;line-height:1.65">
                <div style="font-size:10px;font-weight:600;margin-bottom:3px;opacity:.7">${m.subject}</div>
                ${m.body}
              </div>
            </div>`;
        }).join('') : `<div style="text-align:center;color:var(--t3);font-size:11px;padding:20px">No messages yet — start the conversation below</div>`}
      </div>

      <!-- Reply box -->
      <div style="padding:12px;border-top:1px solid var(--br);background:var(--bg3)">
        <div style="display:flex;gap:8px;align-items:flex-end">
          <textarea id="trainer-reply-${trainerId}" placeholder="Message ${t.name}…" style="flex:1;min-height:52px;max-height:100px;background:var(--bg2);border:1px solid var(--br);border-radius:6px;color:var(--t);font-size:12px;padding:8px;outline:none;resize:none;font-family:var(--font-body)"></textarea>
          <div style="display:flex;flex-direction:column;gap:5px">
            <button class="btn btn-primary btn-sm" onclick="sendTrainerReply('${trainerId}','${t.name}')">Send</button>
            <button class="btn btn-sm" onclick="emailTrainer('${t.email}','${t.name}')">Email</button>
          </div>
        </div>
      </div>
    </div>`;
}



// ── Trainer / Cohort Actions ──────────────────────────────
function openTrainerProfile(id) {
  currentTrainer = id;
  navigate('trainers');
}

function msgTrainer(id, name) {
  activeTrainerMsg = id;
  navigate('trainercomm');
}

function emailTrainer(email, name) {
  navigate('compose');
  setTimeout(() => {
    const to = document.getElementById('email-to');
    if (to) to.value = email;
  }, 100);
}

function bookApptTrainer(id, name) {
  navigate('appointments');
  setTimeout(() => {
    const sel = document.getElementById('appt-founder');
    if (sel) {
      const opt = document.createElement('option');
      opt.value = id; opt.textContent = name + ' (Trainer)';
      sel.appendChild(opt);
      sel.value = id;
    }
  }, 100);
}

function openTrainerChannel(trainerId) {
  activeTrainerMsg = trainerId;
  const t = DEMO_TRAINERS.find(x=>x.id===trainerId);
  // Mark messages as read
  portalState.messages.filter(m=>m.fromId===trainerId).forEach(m=>{ m.unread=false; });
  portalState.saveMessages();
  const thread = document.getElementById('trainer-thread');
  if (thread) thread.innerHTML = renderTrainerThread(trainerId);
  // Update sidebar badge
  document.querySelectorAll('.nav-item').forEach(n => {
    n.className = 'nav-item' + (n.getAttribute('onclick')?.includes("'trainercomm'") ? ' active' : '');
  });
}

function sendTrainerReply(trainerId, trainerName) {
  const ta = document.getElementById('trainer-reply-' + trainerId);
  const body = ta?.value?.trim();
  if (!body) return;
  const msg = {
    id: 'tm_'+Date.now(), from:'Admin', fromId:'admin', to:trainerName,
    subject:'Message from Admin', body, time:'Just now', unread:false, avatar:'AD', type:'trainer',
  };
  portalState.messages.unshift(msg);
  portalState.saveMessages();
  if (ta) ta.value = '';
  const thread = document.getElementById('trainer-thread');
  if (thread) thread.innerHTML = renderTrainerThread(trainerId);
  const msgs = document.getElementById('trainer-chat-msgs');
  if (msgs) msgs.scrollTop = msgs.scrollHeight;
}

function openAddFounderToCohort(cohortId) {
  const modal = document.getElementById('add-founder-modal');
  const sel   = document.getElementById('modal-cohort-sel');
  if (modal) modal.style.display = '';
  if (sel)   sel.value = cohortId;
  modal?.scrollIntoView({ behavior:'smooth' });
}

function openAddTrainerToCohort(trainerOrCohortId) {
  const modal = document.getElementById('add-trainer-modal');
  if (modal) modal.style.display = '';
  // Pre-select if it looks like a trainer id
  const tsel = document.getElementById('modal-trainer-sel');
  const csel = document.getElementById('modal-trainer-cohort-sel');
  if (tsel && DEMO_TRAINERS.find(t=>t.id===trainerOrCohortId)) tsel.value = trainerOrCohortId;
  if (csel && DEMO_COHORTS.find(c=>c.id===trainerOrCohortId)) csel.value = trainerOrCohortId;
  modal?.scrollIntoView({ behavior:'smooth' });
}

function openAssignFounderToTrainer(trainerId, trainerName) {
  const modal = document.getElementById('assign-founder-trainer-modal');
  const sel   = document.getElementById('aff-trainer-sel');
  if (modal) modal.style.display = '';
  if (sel)   sel.value = trainerId;
  modal?.scrollIntoView({ behavior:'smooth' });
}

function closeModal2() {
  ['add-founder-modal','add-trainer-modal','assign-founder-trainer-modal'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = 'none';
  });
}

function assignFounderToCohort() {
  const fId  = document.getElementById('modal-founder-sel')?.value;
  const cId  = document.getElementById('modal-cohort-sel')?.value;
  const res  = document.getElementById('assign-founder-result');
  if (!fId || !cId) { if (res) { res.textContent='Select both founder and cohort'; res.style.color='var(--red)'; } return; }
  const cohort = DEMO_COHORTS.find(c=>c.id===cId);
  const founder= DEMO_FOUNDERS.find(f=>f.id===fId);
  if (cohort && !cohort.founders.includes(fId)) {
    cohort.founders.push(fId);
    if (res) { res.style.color='var(--grn)'; res.textContent = founder.name + ' added to ' + cohort.name.split(' — ')[0]; }
    setTimeout(() => { closeModal2(); navigate('cohorts'); }, 1200);
  } else {
    if (res) { res.style.color='var(--amb)'; res.textContent='Already in this cohort'; }
  }
}

function assignTrainerToCohort() {
  const tId = document.getElementById('modal-trainer-sel')?.value;
  const cId = document.getElementById('modal-trainer-cohort-sel')?.value;
  const res = document.getElementById('assign-trainer-result');
  if (!tId || !cId) { if (res) { res.textContent='Select both'; res.style.color='var(--red)'; } return; }
  const trainer = DEMO_TRAINERS.find(t=>t.id===tId);
  const cohort  = DEMO_COHORTS.find(c=>c.id===cId);
  if (trainer && cohort && !trainer.cohorts.includes(cId)) {
    trainer.cohorts.push(cId);
    if (!cohort.trainers.includes(tId)) cohort.trainers.push(tId);
    if (res) { res.style.color='var(--grn)'; res.textContent = trainer.name + ' assigned to ' + cohort.name.split(' — ')[0]; }
    setTimeout(() => { closeModal2(); navigate('cohorts'); }, 1200);
  } else {
    if (res) { res.style.color='var(--amb)'; res.textContent='Already assigned'; }
  }
}

function assignFounderToTrainer() {
  const tId = document.getElementById('aff-trainer-sel')?.value;
  const fId = document.getElementById('aff-founder-sel')?.value;
  const res = document.getElementById('aff-result');
  if (!tId || !fId) { if (res) { res.textContent='Select both'; res.style.color='var(--red)'; } return; }
  const trainer = DEMO_TRAINERS.find(t=>t.id===tId);
  const founder = DEMO_FOUNDERS.find(f=>f.id===fId);
  if (trainer && founder && !trainer.founders.includes(fId)) {
    trainer.founders.push(fId);

function navigate(panelId) {

  document.querySelectorAll('.nav-item').forEach(n => {

  const panels = {
    dashboard:    renderDashboard,
    founders:     renderFounders,
    progress:     renderProgress,
    inbox:        () => { activeMessage = null; return renderInbox(); },
    compose:      renderCompose,

    trainercomm:  renderTrainerComm,

async function aiDraftEmail() {
  const to      = document.getElementById('email-to')?.value || '';
  const subject = document.getElementById('email-subject')?.value || '';
  const body    = document.getElementById('email-body');
  const apiKey  = localStorage.getItem('los_ai_key');
  if (!apiKey) { alert('Set your AI provider key first in the main LaunchOS™ app under AI Settings.'); return; }
  if (body) body.value = 'AI drafting…';
  const prompt = `You are a startup programme mentor. Draft a professional, warm, and specific email.
To: ${to}
Subject: ${subject}
Context: This is for a startup accelerator programme called LaunchOS™. The mentor is helping a startup founder.
Write the full email body only. Plain text. Warm but professional. 150-250 words.`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,messages:[{role:'user',content:prompt}]}),
    });
    const data = await response.json();
    if (body) body.value = data.content?.[0]?.text || 'Could not generate draft.';
  } catch(e) {
    if (body) body.value = 'AI draft failed — check your API key.';
  }
}

  const dur     = parseInt(document.getElementById('appt-dur')?.value || '60');
  if (!date || !time) { alert('Please fill date and time first'); return; }
  const dtStart = date.replace(/-/g,'') + 'T' + time.replace(':','') + '00';
  const dtEnd   = (() => {
    const d = new Date(date + 'T' + time); d.setMinutes(d.getMinutes()+dur);
    return d.toISOString().replace(/[-:]/g,'').slice(0,15);
  })();
  const gcUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent('LaunchOS™: '+type)}&dates=${dtStart}/${dtEnd}&details=${encodeURIComponent('LaunchOS™ Startup Accelerator — '+type)}&sf=true&output=xml`;
  window.open(gcUrl, '_blank');
}
